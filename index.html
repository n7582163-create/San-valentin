<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Proposal</title>
    <script>
        let noClickCounter = 0;
        function handleNoClick() {
            noClickCounter++;
            const messages = [
                "But I'm really hoping you'll say yes!", 
                "What if I promise to cook dinner every weekend?", 
                "You deserve all the love and happiness!", 
                "Think about all the amazing moments we could share!", 
                "I'm confident that together, we can create something beautiful!"
            ];
            alert(messages[noClickCounter % messages.length]);
        }
    </script>
</head>
<body>
    <h1>My Dear,</h1>
    <p>Every moment we spend together is a treasure. I want to create more beautiful memories with you.</p>
    <p>Will you join me for a romantic dinner? Let’s make it a night to remember!</p>
    <button onclick="handleNoClick()">No</button>
    <button onclick="alert('Yay! I’m so happy you said yes!')">Yes</button>
</body>
</html>
